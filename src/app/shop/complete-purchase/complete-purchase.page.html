<header class="bar">
  <button type="button" class="back" aria-label="Back" (click)="back()"><i class="ri-arrow-left-s-line"></i></button>
</header>

<ion-content [fullscreen]="true">
  <div class="center">
    <span class="badge"><i class="ri-gift-2-line"></i></span>
    <h1>Complete Your Purchase</h1>
    <p>Please log in if you already have an account, or register to create a new account and access your gift.</p>
    <a class="pill-btn accent" routerLink="/login" [queryParams]="{ redirect: '/review' }">Log In</a>
    <a class="pill-btn outline" routerLink="/register" [queryParams]="{ redirect: '/review' }">Create Account</a>
  </div>
</ion-content>
