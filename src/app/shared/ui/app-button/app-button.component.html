<ion-button
  [fill]="variant()"
  [color]="color()"
  [type]="type()"
  [size]="size()"
  [expand]="block() ? 'block' : undefined"
  [disabled]="disabled() || loading()"
  [class.pill]="pill()"
  (click)="onClick($event)"
>
  @if (loading()) {
    <ion-spinner name="crescent"></ion-spinner>
  } @else {
    @if (icon()) {
      <i class="btn-icon" [class]="icon()" aria-hidden="true"></i>
    }
    <ng-content></ng-content>
  }
</ion-button>
